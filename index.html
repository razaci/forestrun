<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Forest Run</title><style>*{box-sizing:border-box}body{margin:0;background:#081a1c;color:#e8fff0;font-family:system-ui;overscroll-behavior:none}main{max-width:580px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px}b{color:#a9ef91}button{border:1px solid #719b86;border-radius:14px;background:#153c37;color:white;padding:12px 18px;font:700 16px system-ui;touch-action:none}#stage{position:relative}canvas{display:block;width:100%;height:min(72vh,700px);touch-action:none;border-radius:18px}#cover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:#03151155;border-radius:18px}article{max-width:300px;padding:24px;border-radius:22px;background:#092a2beb;box-shadow:0 12px 60px #0008}h1{margin:0;font-size:32px}p{line-height:1.6;color:#c4ddcf}.controls{display:flex;gap:10px;padding:12px}.controls button{flex:1}small{display:block;text-align:center;color:#adc7b9;padding:0 8px 12px}#stats{font-size:13px;text-align:right}</style><main><header><b>FOREST RUN</b><span id="stats">A woodland traffic adventure</span></header><div id="stage"><canvas id="c"></canvas><div id="cover"><article><h1>Take the scenic route.</h1><p>A winding forest highway. Cars, lumber trucks, and a little red coupe of your own. Dodge traffic and grab glowing fuel cans.</p><button id="go">Start driving</button><p id="record"></p></article></div></div><div class="controls"><button id="left" aria-label="Steer left">◀</button><button id="pause">Pause</button><button id="right" aria-label="Steer right">▶</button></div><small>Drag to steer · Arrow keys / A D · Space to pause</small></main><script>
const c=document.getElementById('c'),g=c.getContext('2d'),stats=document.getElementById('stats'),cover=document.getElementById('cover'),go=document.getElementById('go'),rec=document.getElementById('record'),pause=document.getElementById('pause');const W=500,H=720;c.width=W;c.height=H;let best=0;try{best=+localStorage.getItem('forest-run-best')||0}catch(e){}rec.textContent='Best trip: '+best+' m';let state='ready',x=250,target=250,dist=0,fuel=100,hp=3,time=0,spawn=0,items=[],flash=0,keys={},last=0,inv=0;function road(y){return 250+Math.sin(y/350+time*.15)*27}function start(){x=target=250;dist=0;fuel=100;hp=3;time=0;spawn=0;items=[];flash=inv=0;state='play';cover.style.display='none';pause.textContent='Pause'}go.onclick=start;function toggle(){if(state==='play'){state='pause';pause.textContent='Resume'}else if(state==='pause'){state='play';pause.textContent='Pause'}}pause.onclick=toggle;document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')toggle()});function end(){state='over';best=Math.max(best,Math.floor(dist));try{localStorage.setItem('forest-run-best',best)}catch(e){}cover.style.display='flex';cover.querySelector('h1').textContent=hp<=0?'Trip complete!':'Out of fuel!';cover.querySelector('p').textContent=Math.floor(dist)+' meters through the woods. Best: '+best+' m. Try another trip.';go.textContent='Drive again';rec.textContent='Collect green fuel cans. You have three hearts.'}
for(const [id,key]of [['left','ArrowLeft'],['right','ArrowRight']]){let b=document.getElementById(id);b.onpointerdown=e=>{b.setPointerCapture(e.pointerId);keys[key]=true};b.onpointerup=b.onpointercancel=()=>keys[key]=false}onkeydown=e=>{if(['ArrowLeft','ArrowRight',' ','a','d','A','D'].includes(e.key)){e.preventDefault();keys[e.key.toLowerCase()]=true;if(e.key===' '&&!e.repeat)toggle()}};onkeyup=e=>keys[e.key.toLowerCase()]=false;onblur=()=>{keys={};if(state==='play')toggle()};let drag=false;function steer(e){let r=c.getBoundingClientRect();target=(e.clientX-r.left)/r.width*W}c.onpointerdown=e=>{drag=true;c.setPointerCapture(e.pointerId);steer(e)};c.onpointermove=e=>{if(drag)steer(e)};c.onpointerup=c.onpointercancel=()=>drag=false;
function rect(x,y,w,h,col,r=7){g.fillStyle=col;g.beginPath();g.roundRect(x,y,w,h,r);g.fill()}function vehicle(xx,yy,truck,col){g.save();g.translate(xx,yy);rect(-28,-39,62,truck?129:89,'#0004',12);let len=truck?113:76;rect(-25,-len/2+8,9,22,'#122125');rect(16,-len/2+8,9,22,'#122125');rect(-25,len/2-29,9,22,'#122125');rect(16,len/2-29,9,22,'#122125');rect(-21,-len/2,42,len,col,9);if(truck){rect(-18,-len/2+5,36,68,'#dbc8a2',4);for(let i=0;i<4;i++)rect(-15+i*8,-len/2+7,5,64,'#a17b48',2);rect(-16,26,32,14,'#a7d5d8',3)}else{rect(-16,-22,32,17,'#9ddddd',4);rect(-14,12,28,14,'#385c68',4);rect(-12,-1,24,10,col,2)}rect(-17,-len/2,9,4,'#fff6bc',2);rect(8,-len/2,9,4,'#fff6bc',2);rect(-17,len/2-5,8,4,'#ff6e5e',2);rect(9,len/2-5,8,4,'#ff6e5e',2);g.restore()}
function tree(xx,yy,s){g.save();g.translate(xx,yy);g.scale(s,s);g.fillStyle='#0002';g.beginPath();g.ellipse(7,14,25,12,0,0,7);g.fill();rect(-4,-5,8,23,'#75684c');for(let i=0;i<3;i++){g.fillStyle=['#164e3a','#217449','#389655'][i];g.beginPath();g.moveTo(0,-62+i*16);g.lineTo(-26+i*4,4+i*3);g.lineTo(26-i*4,4+i*3);g.fill()}g.restore()}
function draw(){g.fillStyle='#588954';g.fillRect(0,0,W,H);for(let i=0;i<24;i++){let yy=(i*43+time*220)%850-80;let xx=i%2?28:470;tree(xx+(Math.sin(i*14)*20),yy,.75+(i%3)*.18)}g.beginPath();for(let y=-10;y<=H+10;y+=10)g.lineTo(road(y)-148,y);for(let y=H+10;y>=-10;y-=10)g.lineTo(road(y)+148,y);g.closePath();g.fillStyle='#b9b393';g.fill();g.beginPath();for(let y=-10;y<=H+10;y+=10)g.lineTo(road(y)-137,y);for(let y=H+10;y>=-10;y-=10)g.lineTo(road(y)+137,y);g.closePath();g.fillStyle='#344448';g.fill();g.strokeStyle='#e7e5c7';g.lineWidth=3;for(let lane of [-46,46])for(let yy=-70;yy<H;yy+=85){let y=yy+(time*220)%85;g.beginPath();g.moveTo(road(y)+lane,y);g.lineTo(road(y+38)+lane,y+38);g.stroke()}for(let a of items){let xx=road(a.y)+a.lane*87;if(a.kind==='fuel'){g.shadowColor='#a7ff8a';g.shadowBlur=22;rect(xx-15,a.y-20,30,40,'#a8f778');g.shadowBlur=0;rect(xx-6,a.y-25,12,6,'#e6ffb9');g.fillStyle='#174d30';g.font='bold 22px system-ui';g.fillText('+',xx-8,a.y+7)}else vehicle(xx,a.y,a.kind==='truck',a.color)}if(inv<=0||Math.floor(time*12)%2)vehicle(x,590,false,'#f35a4a');if(flash>0){g.fillStyle='#ff433344';g.fillRect(0,0,W,H)}if(state==='pause'){rect(130,315,240,75,'#092a2be8');g.fillStyle='white';g.textAlign='center';g.font='bold 28px system-ui';g.fillText('Paused',250,363);g.textAlign='left'}let shade=g.createLinearGradient(0,0,0,H);shade.addColorStop(0,'#c7dfaa28');shade.addColorStop(1,'#00000000');g.fillStyle=shade;g.fillRect(0,0,W,H)}
function frame(now){let dt=Math.min((now-last)/1000||0,.04);last=now;if(state==='play'){time+=dt;dist+=dt*24;fuel-=dt*1.5;inv=Math.max(0,inv-dt);flash=Math.max(0,flash-dt);let dir=(keys.ArrowRight||keys.arrowright||keys.d?1:0)-(keys.ArrowLeft||keys.arrowleft||keys.a?1:0);if(dir)target=x+dir*310*dt;target=Math.max(road(590)-111,Math.min(road(590)+111,target));x+=(target-x)*Math.min(1,dt*15);spawn-=dt;if(spawn<=0){spawn=Math.max(.7,1.45-dist/8000);let kind=Math.random()<.24?'fuel':Math.random()<.4?'truck':'car';items.push({y:-130,lane:Math.floor(Math.random()*3)-1,kind,color:['#f7be62','#80aed3','#c4d5cc','#a08cc7'][Math.floor(Math.random()*4)]})}for(let a of items){a.y+=dt*(200+Math.min(100,dist/35));let xx=road(a.y)+a.lane*87;if(Math.abs(xx-x)<(a.kind==='fuel'?30:40)&&Math.abs(a.y-590)<(a.kind==='truck'?87:a.kind==='fuel'?48:64)&&!a.hit){if(a.kind==='fuel'){fuel=Math.min(100,fuel+25);a.hit=true;a.y=900}else if(inv<=0){hp--;inv=1.8;flash=.3;a.hit=true}}}items=items.filter(a=>a.y<850);stats.textContent=Math.floor(dist)+' m · Fuel '+Math.ceil(fuel)+'% · '+'♥'.repeat(Math.max(0,hp));if(hp<=0||fuel<=0)end()}else if(state==='ready')time+=dt*.3;draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
